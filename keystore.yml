name: Create Signing Key
on: workflow_dispatch
jobs:
  key:
    runs-on: ubuntu-24.04
    steps:
      - name: Generate and store key
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "Add secret GH_PAT first"; exit 1; fi
          if gh secret list --repo "$REPO" | grep -q KS_B64; then echo "Key already exists. Not overwriting."; exit 1; fi
          PASS=$(openssl rand -hex 16)
          echo "::add-mask::$PASS"
          keytool -genkeypair -keystore ks.jks -storepass "$PASS" -keypass "$PASS" -alias app -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=App, O=Dev, C=IQ"
          gh secret set KS_B64 --repo "$REPO" --body "$(base64 -w0 ks.jks)"
          gh secret set KS_PASS --repo "$REPO" --body "$PASS"
          echo "Signing key saved to repository secrets."
