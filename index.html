:root{--bg:#070a12;--cd:rgba(255,255,255,.05);--bd:rgba(255,255,255,.09);--tx:#eef1fb;--mu:#8f98b3;--ac:#8b5cf6;--ac2:#22d3ee;--fs:14px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(60% 40% at 95% -5%,#8b5cf63d,transparent),radial-gradient(50% 35% at 0% 25%,#22d3ee26,transparent),var(--bg);color:var(--tx);font:16px/1.55 system-ui,KAr,"Noto Sans Arabic","Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;letter-spacing:0;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
header{display:flex;align-items:center;gap:10px;padding:14px 18px 4px;font-size:18px;font-weight:700}
.lg svg{width:30px;height:30px;display:block}
main{flex:1;overflow:auto}
.v{display:none;padding:6px 16px 24px}.v.on{display:block;animation:fi .25s}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
nav{display:flex;margin:6px 14px calc(10px + env(safe-area-inset-bottom,0px));padding:6px;border-radius:26px;background:rgba(20,25,42,.85);border:1px solid var(--bd);backdrop-filter:blur(16px)}
nav button{flex:1;min-height:54px;background:0;border:0;color:var(--mu);font:inherit;font-size:12px;border-radius:20px;transition:.2s}
nav button.on{color:#fff;background:linear-gradient(135deg,#8b5cf655,#22d3ee33)}
nav svg{width:22px;height:22px;display:block;margin:0 auto 2px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.b{display:block;width:100%;min-height:48px;margin:8px 0;padding:10px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--ac),#3b82f6);color:#fff;font:inherit;font-weight:700;box-shadow:0 8px 22px #8b5cf640;transition:.15s}
.b:active{transform:scale(.97)}
.b.g{background:var(--cd);border:1px solid var(--bd);box-shadow:none;color:var(--tx);font-weight:500}
.i{min-width:44px;min-height:44px;border:1px solid var(--bd);border-radius:14px;background:var(--cd);color:var(--tx);font:inherit}
.c,.card{background:var(--cd);border:1px solid var(--bd);border-radius:22px;padding:14px 16px;margin:12px 0;backdrop-filter:blur(12px)}
.c{display:flex;align-items:center;gap:10px}
.card h3{margin-top:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.t{background:var(--cd);border:1px solid var(--bd);border-radius:24px;padding:18px 10px;text-align:center;font-weight:600;transition:.15s}
.t:active{transform:scale(.96)}.t .ic{margin:0 auto 10px;display:block}
.ic{width:72px;height:72px;border-radius:20px;object-fit:cover;box-shadow:0 8px 24px #0007}
.ic.s{width:48px;height:48px;border-radius:14px}.ic.l{width:120px;height:120px;border-radius:30px}
.hero{padding:18px 4px 6px}.hero h1{font-size:32px;line-height:1.2;margin:0 0 8px}
.hero h1 span{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mu);margin:0 0 10px}
.em{text-align:center;color:var(--mu);padding:30px 0}.em svg{width:80px;height:80px}
input,select,button,textarea{font-family:inherit;letter-spacing:0}
input,select{width:100%;min-height:48px;margin:6px 0 12px;padding:10px 14px;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:14px;color:var(--tx);font:inherit;outline:0}
input:focus,select:focus{border-color:var(--ac2)}
input[type=range]{padding:0;min-height:30px}
label{color:var(--mu);font-size:14px}small{color:var(--mu)}
h3{display:flex;justify-content:space-between;align-items:center}
summary{padding:10px 0;color:var(--ac2)}
.row{display:flex;gap:8px}.row .b{flex:1}
.pick{display:flex;flex-direction:column;align-items:center;gap:8px;margin:6px 0 14px;color:var(--ac2)}
.code{font:700 34px ui-monospace,monospace;letter-spacing:6px;text-align:center;padding:18px;border-radius:18px;background:var(--cd);border:1px dashed var(--ac2);direction:ltr;margin:12px 0}
.st{padding:0 22px;margin:8px 0}.st li{margin:9px 0}.st a{color:var(--ac2)}
.bar{display:flex;gap:6px;align-items:center;padding:8px;background:rgba(20,25,42,.95);border-bottom:1px solid var(--bd)}
#ed,#md{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#ed{z-index:5}#md{z-index:6}
.tabs,.sym{display:flex;overflow-x:auto;gap:6px;padding:6px 8px;background:#0d1120;border-bottom:1px solid var(--bd);direction:ltr}
.tabs span,.sym span{flex:none;min-width:44px;min-height:40px;display:flex;align-items:center;justify-content:center;padding:0 12px;border-radius:12px;background:var(--cd);color:var(--mu);font-family:ui-monospace,KAr,"Noto Sans Arabic","Noto Naskh Arabic",monospace}
.tabs span.on{color:#fff;background:linear-gradient(135deg,var(--ac),#3b82f6)}
.eb{flex:1;display:flex;direction:ltr;min-height:0}
#g{margin:0;width:46px;padding:10px 6px;background:#0a0d18;color:var(--mu);text-align:right;overflow:hidden}
#g,#t{font:var(--fs)/1.5 ui-monospace,Menlo,Consolas,KAr,"Noto Sans Arabic","Noto Naskh Arabic",monospace}
#t{unicode-bidi:plaintext;letter-spacing:0;font-variant-ligatures:none}
#t{flex:1;background:0;color:var(--tx);border:0;outline:0;resize:none;padding:10px;white-space:pre;overflow:auto;direction:ltr;text-align:left}
.mb{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column}
iframe{flex:1;width:100%;border:0;background:#fff;border-radius:14px;min-height:200px}
#cons{height:30%;overflow:auto;background:#04060c;border-radius:14px;margin-top:8px;padding:8px;font:12px monospace;direction:ltr;text-align:left}
.error{color:#ff6b7a}.warn{color:#ffd166}
pre.lg2{white-space:pre-wrap;background:rgba(0,0,0,.3);border-radius:14px;padding:12px;direction:ltr;text-align:left;font-size:13px;min-height:0}pre.lg2:empty{display:none}
.cr{text-align:center;background:linear-gradient(135deg,#8b5cf622,#22d3ee1c);border:1px solid var(--bd);border-radius:26px;padding:24px}
.cr .lg svg{width:84px;height:84px;margin:0 auto 8px}
#to{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#222a40;padding:10px 18px;border-radius:20px;z-index:50;display:none;max-width:90%;text-align:center}
#lk{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}

#sp{position:fixed;inset:0;z-index:40;background:radial-gradient(60% 40% at 50% 35%,#8b5cf655,transparent),#070a12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .45s}
#sp.out{opacity:0;pointer-events:none}
#sp .sl{width:116px;height:116px;animation:pu 1.6s ease-in-out infinite}
#sp .sl svg,#sp .sl img{width:100%;height:100%;display:block}
@keyframes pu{50%{transform:scale(1.08)}}
#sp h1{margin:0;font-size:26px;color:#eef1fb}
.ld{width:180px;height:5px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}

()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]};\nlet D={},T='';\nfunction load(def){let o={};try{o=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}D=Object.assign({},def,o)}\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}\nfunction toast(m){let t=$('#to');if(!t){t=document.createElement('div');t.id='to';document.body.append(t)}t.textContent=m;t.style.display='block';clearTimeout(t.k);t.k=setTimeout(()=>t.style.display='none',2200)}\nfunction closeSheet(){const s=$('.sh');if(s)s.remove()}\nfunction sheet(title,html,ok,txt){closeSheet();const s=document.createElement('div');s.className='sh';s.innerHTML='<div class=\"shc\"><div class=\"shh\"><b>'+esc(title)+'<\/b><button class=\"ib\" id=\"shx\">✕<\/button><\/div><div id=\"shb\">'+html+'<\/div>'+(ok?'<button class=\"btn\" id=\"shok\">'+(txt||'حفظ')+'<\/button>':'')+'<\/div>';document.body.append(s);s.onclick=e=>{if(e.target==s)closeSheet()};$('#shx').onclick=closeSheet;if(ok)$('#shok').onclick=()=>{if(ok()!==false)closeSheet()};return s}\nfunction ask(msg,cb,txt){sheet('تأكيد','<p>'+esc(msg)+'<\/p>',()=>{cb()},txt||'إي، متأكد')}\nfunction wa(phone,msg){let p=String(phone||'').replace(/\\D/g,'');if(!p)return toast('ماكو رقم هاتف');if(p[0]=='0')p='964'+p.slice(1);window.open('https://wa.me/'+p+'?text='+encodeURIComponent(msg),'_blank')}\nfunction setTab(t){T=t;render();scrollTo(0,0)}\nfunction navHTML(tabs){return '<div class=\"nav\">'+tabs.map(t=>'<button class=\"'+(T==t[0]?'on':'')+'\" onclick=\"setTab(\\''+t[0]+'\\')\"><i>'+t[2]+'<\/i>'+t[1]+'<\/button>').join('')+'<\/div>'}\nconst empty=(i,t)=>'<div class=\"empty\"><i>'+i+'<\/i>'+t+'<\/div>';\nconst val=id=>($('#'+id)||{}).value||'';\n\nconst KEY='app_shop_v1';\nload({shop:'محلي',products:[],sales:[],cart:{}});\nT='pos';\nconst TABS=[['pos','البيع','🛒'],['prod','المنتجات','📦'],['rep','التقارير','📈']];\nconst P=id=>D.products.find(p=>p.id==id);\nconst cartItems=()=>Object.keys(D.cart).map(id=>({p:P(id),q:D.cart[id]})).filter(x=>x.p);\nconst cartTotal=()=>cartItems().reduce((a,x)=>a+x.p.price*x.q,0);\nconst cartQty=()=>cartItems().reduce((a,x)=>a+x.q,0);\nlet q='';\nfunction render(){$('#app').innerHTML=T=='pos'?vPos():T=='prod'?vProd():vRep();$('#nav').innerHTML=navHTML(TABS);const f=$('#fab');if(f)f.remove();const c=$('#cb');if(c)c.remove();\nif(T=='prod'){const b=document.createElement('button');b.id='fab';b.className='fab';b.textContent='+';b.onclick=()=>editProd();document.body.append(b)}\nif(T=='pos'&&cartQty()){const b=document.createElement('div');b.id='cb';b.className='cartbar';b.innerHTML='<button class=\"btn\" onclick=\"openCart()\">🛒 السلة ('+cartQty()+') — '+num(cartTotal())+' د.ع<\/button>';document.body.append(b)}}\nfunction vPos(){const L=D.products.filter(p=>!q||p.name.includes(q));\nreturn `<div class=\"top\"><div class=\"logo\">🛒<\/div><h1>${esc(D.shop)}<\/h1><\/div><input placeholder=\"🔍 دوّر على منتج...\" value=\"${esc(q)}\" oninput=\"q=this.value;$('#pg').innerHTML=pgrid()\"><div id=\"pg\">${pgrid()}<\/div>`}\nfunction pgrid(){const L=D.products.filter(p=>!q||p.name.includes(q));return L.length?'<div class=\"pgrid\">'+L.map(p=>`<button class=\"pc\" onclick=\"addCart('${p.id}')\" ${p.stock<=0?'style=\"opacity:.45\"':''}>${D.cart[p.id]?'<span class=\"q\">'+D.cart[p.id]+'<\/span>':''}<b>${esc(p.name)}<\/b><small>${p.stock<=0?'خالص ❌':'المخزون: '+p.stock}<\/small><span class=\"pr\">${num(p.price)}<\/span><\/button>`).join('')+'<\/div>':empty('📦',D.products.length?'ماكو منتج بهذا الاسم':'أضف منتجاتك من تبويب المنتجات أول')}\nfunction addCart(id){const p=P(id);if((D.cart[id]||0)>=p.stock)return toast('المخزون ما يكفي');D.cart[id]=(D.cart[id]||0)+1;save();const y=scrollY;render();scrollTo(0,y)}\nfunction openCart(){const draw=()=>{const L=cartItems();if(!L.length){closeSheet();render();return}\n$('#cartb').innerHTML=L.map(x=>`<div class=\"li\"><div class=\"m\"><b>${esc(x.p.name)}<\/b><small>${num(x.p.price)} × ${x.q}<\/small><\/div><button class=\"ib\" onclick=\"cq('${x.p.id}',-1)\">−<\/button><b>${x.q}<\/b><button class=\"ib\" onclick=\"cq('${x.p.id}',1)\">+<\/button><\/div>`).join('')+`<label>خصم (دينار)<\/label><input id=\"ds\" type=\"number\" inputmode=\"numeric\" placeholder=\"0\" oninput=\"$('#tt').textContent=num(Math.max(0,cartTotal()-(+this.value||0)))\"><div class=\"row\" style=\"margin:6px 0\"><b>المجموع<\/b><b class=\"amt ok\" style=\"text-align:left;font-size:20px\"><span id=\"tt\">${num(cartTotal())}<\/span> د.ع<\/b><\/div>`};\nsheet('السلة','<div id=\"cartb\"><\/div>',()=>{const L=cartItems(),ds=+val('ds')||0,tot=Math.max(0,cartTotal()-ds);if(!L.length)return false;\nconst items=L.map(x=>({pid:x.p.id,name:x.p.name,qty:x.q,price:x.p.price,cost:x.p.cost||0}));L.forEach(x=>x.p.stock-=x.q);\nconst cost=items.reduce((a,i)=>a+i.cost*i.qty,0);D.sales.push({id:uid(),date:today(),time:pad(new Date().getHours())+':'+pad(new Date().getMinutes()),items,total:tot,profit:tot-cost,disc:ds});D.cart={};save();toast('✅ تم البيع: '+num(tot)+' د.ع');render()},'✅ تم البيع');\nwindow.__cd=draw;draw()}\nfunction cq(id,d){const p=P(id);const n=(D.cart[id]||0)+d;if(n<=0)delete D.cart[id];else if(n>p.stock)return toast('المخزون ما يكفي');else D.cart[id]=n;save();window.__cd()}\nfunction vProd(){const low=D.products.filter(p=>p.stock<=(p.low||3));\nreturn `<div class=\"top\"><div class=\"logo\">📦<\/div><h1>المنتجات <small class=\"mu\">(${D.products.length})<\/small><\/h1><\/div>\n${low.length?`<div class=\"card\" style=\"border-color:var(--warn)\"><b class=\"warn\">⚠️ ناقصة بالمخزون (${low.length})<\/b><br><small class=\"mu\">${low.map(p=>esc(p.name)+' ('+p.stock+')').join('، ')}<\/small><\/div>`:''}\n${D.products.length?D.products.map(p=>`<div class=\"li\" onclick=\"editProd('${p.id}')\"><div class=\"av\">${esc(p.name[0])}<\/div><div class=\"m\"><b>${esc(p.name)}<\/b><small>سعر الشراء ${num(p.cost)} • ربح ${num(p.price-p.cost)}<\/small><\/div><div style=\"text-align:left\"><div class=\"amt\">${num(p.price)}<\/div><small class=\"${p.stock<=(p.low||3)?'bad wport-fit=cover\"><meta name=\"theme-color\" content=\"#080c18\"><title>دفتر الديون<\/title><link rel=\"stylesheet\" href=\"style.css\"><\/head><body style=\"--ac:#f43f5e;--ac2:#a855f7\"><div id=\"app\"><\/div><div id=\"nav\"><\/div><script src=\"app.js\"><\/script><\/body><\/html>", "style.css": ":root{--bg:#080c18;--bg2:#0d1324;--card:#111a30;--card2:#16213c;--line:#22304f;--tx:#eef2ff;--mu:#8b97b8;--ac:#6366f1;--ac2:#22d3ee;--ok:#34d399;--bad:#fb7185;--warn:#fbbf24;color-scheme:dark}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nhtml,body{margin:0;min-height:100%}\nbody{background:radial-gradient(70% 40% at 100% -5%,color-mix(in srgb,var(--ac) 38%,transparent),transparent),radial-gradient(60% 35% at 0% 22%,color-mix(in srgb,var(--ac2) 18%,transparent),transparent),var(--bg);background-attachment:fixed;color:var(--tx);font:15px/1.6 system-ui,\"Noto Sans Arabic\",\"Segoe UI\",Tahoma,sans-serif;padding-bottom:100px}\n#app{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 0}\n.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}\n.top h1{flex:1;margin:0;font-size:22px}\n.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 10px 22px -10px var(--ac)}\n.hero{border-radius:28px;padding:20px;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac2) 75%,var(--ac)));box-shadow:0 24px 44px -20px var(--ac);position:relative;overflow:hidden;color:#fff}\n.hero:after{content:\"\";position:absolute;width:200px;height:200px;border-radius:50%;background:#ffffff1f;left:-70px;top:-90px}\n.hero small{opacity:.9;display:block}.hero .big{font-size:36px;font-weight:800;line-height:1.25;direction:ltr;text-align:right}\n.hero .sub{display:flex;gap:18px;margin-top:10px;position:relative;z-index:1}.hero .sub div{flex:1;background:#0000002e;border-radius:16px;padding:8px 12px}.hero .sub b{display:block;font-size:17px;direction:ltr;text-align:right}\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}\n.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}.stat b{display:block;font-size:22px;direction:ltr;text-align:right}.stat span{color:var(--mu);font-size:12.5px}\n.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;margin:12px 0}\nh2{font-size:16px;margin:18px 2px 8px;display:flex;align-items:center;gap:8px}h2 small{color:var(--mu);font-weight:400;margin-inline-start:auto}\n.li{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin:8px 0}\n.av{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}\n.li .m{flex:1;min-width:0}.li .m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li .m small{color:var(--mu)}\n.amt{font-weight:800;direction:ltr}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mu{color:var(--mu)}\n.btn{display:block;width:100%;min-height:50px;border:0;border-radius:16px;font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 10px 24px -12px var(--ac);padding:10px 16px;margin:6px 0}\n.btn.g{background:var(--card2);box-shadow:none;border:1px solid var(--line)}.btn.r{background:linear-gradient(135deg,#f43f5e,#be123c);box-shadow:none}\n.btn.s{min-height:36px;width:auto;display:inline-block;font-size:13px;padding:4px 14px;border-radius:12px;margin:0}\n.ib{flex:none;border:0;background:var(--card2);color:var(--tx);width:40px;height:40px;border-radius:13px;font-size:17px}\ninput,select,textarea{width:100%;min-height:48px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);font:inherit;margin:4px 0 10px;outline:0}\ninput:focus,s ding:10px 18px;border-radius:99px;font-weight:700;z-index:30;display:none;white-space:nowrap}\n", "app.js": "const KEY0=1;\nconst $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];\nconst esc=s=>String(s==null?'':s).replace(/[&<>\"']/g,c=>'&#'+c.charCodeAt(0)+';');\nconst uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);\nconst num=n=>Math.round(Number(n)||0).toLocaleString('en-US');\nconst pad=n=>String(n).padStart(2,'0');\nconst ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());\nconst today=()=>ymd(new Date());\nconst DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];\nconst MONTHS=['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];\nconst fdate=s=>{const d=new Date(s+'T00:00:00');return DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]};\nlet D={},T='';\nfunction load(def){let o={};try{o=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}D=Object.assign({},def,o)}\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}\nfunction toast(m){let t=$('#to');if(!t){t=document.createElement('div');t.id='to';document.body.append(t)}t.textContent=m;t.style.display='block';clearTimeout(t.k);t.k=setTimeout(()=>t.style.display='none',2200)}\nfunction closeSheet(){const s=$('.sh');if(s)s.remove()}\nfunction sheet(title,html,ok,txt){closeSheet();const s=document.createElement('div');s.className='sh';s.innerHTML='<div class=\"shc\"><div class=\"shh\"><b>'+esc(title)+'<\/b><button class=\"ib\" id=\"shx\">✕<\/button><\/div><div id=\"shb\">'+html+'<\/div>'+(ok?'<button class=\"btn\" id=\"shok\">'+(txt||'حفظ')+'<\/button>':'')+'<\/div>';document.body.append(s);s.onclick=e=>{if(e.target==s)closeSheet()};$('#shx').onclick=closeSheet;if(ok)$('#shok').onclick=()=>{if(ok()!==false)closeSheet()};return s}\nfunction ask(msg,cb,txt){sheet('تأكيد','<p>'+esc(msg)+'<\/p>',()=>{cb()},txt||'إي، متأكد')}\nfunction wa(phone,msg){let p=String(phone||'').replace(/\\D/g,'');if(!p)return toast('ماكو رقم هاتف');if(p[0]=='0')p='964'+p.slice(1);window.open('https://wa.me/'+p+'?text='+encodeURIComponent(msg),'_blank')}\nfunction setTab(t){T=t;render();scrollTo(0,0)}\nfunction navHTML(tabs){return '<div class=\"nav\">'+tabs.map(t=>'<button class=\"'+(T==t[0]?'on':'')+'\" onclick=\"setTab(\\''+t[0]+'\\')\"><i>'+t[2]+'<\/i>'+t[1]+'<\/button>').join('')+'<\/div>'}\nconst empty=(i,t)=>'<div class=\"empty\"><i>'+i+'<\/i>'+t+'<\/div>';\nconst val=id=>($('#'+id)||{}).value||'';\n\nconst KEY='app_debts_v1';\nload({people:[],tx:[]});\nT='ppl';\nconst TABS=[['ppl','الأشخاص','👥'],['log','السجل','📒']];\nconst bal=id=>D.tx.filter(x=>x.pid==id).reduce((a,x)=>a+(x.type=='debt'?x.amt:-x.amt),0);\nconst person=id=>D.people.find(p=>p.id==id);\nlet q='';\nfunction render(){$('#app').innerHTML=T=='ppl'?vPpl():vLog();$('#nav').innerHTML=navHTML(TABS);const f=$('#fab');if(f)f.remove();if(T=='ppl'){const b=document.createElement('button');b.id='fab';b.className='fab';b.textContent='+';b.onclick=()=>editP();document.body.append(b)}}\nfunction vPpl(){const tot=D.people.reduce((a,p)=>a+Math.max(0,bal(p.id)),0),n=D.people.filter(p=>bal(p.id)>0).length;\nconst L=D.people.filter(p=>!q||p.name.includes(q)).map(p=>({p,b:bal(p.id)})).sort((a,b)=>b.b-a.b);\nreturn `<div class=\"top\"><div class=\"logo\">📒<\/div><h1>دفتر الديون<\/h1><\/div>\n<div class=\"hero\"><small>المبلغ اللي بذمة الناس إلك<\/small><div class=\"big\">${num(tot)} د.ع<\/div><div class=\"sub\"><div><small>عدد المدينين<\/small><b>${n}<\/b><\/div><div><small>مجموع الأشخاص<\/small><b>${D.people.length}<\/b><\/div><\/div><\/div>\n<input style=\"margin-top:12px\" placeholder=\"🔍 دوّر على شخص...\" value=\"${esc(q)}\" oninput=\"q=this.value;render3()\"><div id=\"pl\">${plist(L)}<\/div>`}\nfunction plist(L){return L.length?L.map(({p,b})=>`<div class=\"li\" onclick=\"pInfo('${p.id}')\"><div class=\"av\">${esc(p.name[0])}<\/div><div class=\"m\"><b>${ function ctxCode(){let s='ملفات المشروع (الملف المفتوح الآن: '+F+'):\n';for(const n of Object.keys(P.files)){const c=P.files[n]||'',l=n==F?30000:6000;s+='\n### FILE '+n+'\n'+(c.length>l?c.slice(0,l)+'\n...[اقتطع الباقي]':c)+'\n'}return s}
function parseEdits(x){if(x.includes('@@@'))x=x.replace(/^[ \t]*```\w*[ \t]*$/gm,'');const lines=x.split('\n'),txt=[],ops=[];let i=0;
while(i<lines.length){const l=lines[i],m=l.match(/^@@@\s*(FILE|WRITE)\s+(\S+)/i);
if(!m){txt.push(l);i++;continue}const f=m[2].replace(/^["'`]|["'`]$/g,'');i++;
if(m[1].toUpperCase()=='WRITE'){const b=[];while(i<lines.length&&!/^@@@\s*END/i.test(lines[i])&&!/^@@@\s*(FILE|WRITE)/i.test(lines[i]))b.push(lines[i++]);if(i<lines.length&&/^@@@\s*END/i.test(lines[i]))i++;ops.push({t:'W',f,c:b.join('\n')});continue}
while(i<lines.length&&!/^@@@/.test(lines[i])){if(/^<{5,}\s*SEARCH/.test(lines[i])){i++;const s=[],r=[];while(i<lines.length&&!/^={5,}\s*$/.test(lines[i]))s.push(lines[i++]);i++;while(i<lines.length&&!/^>{5,}\s*REPLACE/.test(lines[i]))r.push(lines[i++]);i++;ops.push({t:'S',f,s:s.join('\n'),r:r.join('\n')})}else i++}}
return{text:txt.join('\n').trim(),ops}}
function findLoose(txt,s){const a=txt.split('\n'),b=s.split('\n').map(x=>x.trim());while(b.length&&!b[0])b.shift();while(b.length&&!b[b.length-1])b.pop();if(!b.length)return null;
for(let i=0;i+b.length<=a.length;i++){let ok=1;for(let k=0;k<b.length;k++)if(a[i+k].trim()!==b[k]){ok=0;break}if(ok)return[i,i+b.length]}return null}
function applyOps(ops){const det=[];for(const o of ops){const d={f:o.f,t:o.t,ok:false,del:[],add:[]};det.push(d);
if(o.t=='W'){const old=P.files[o.f];d.isNew=old==null;d.add=o.c.split('\n');d.del=old==null?[]:old.split('\n');P.files[o.f]=o.c;d.ok=true;continue}
const t=P.files[o.f];if(t==null){d.why='الملف مو موجود';continue}
d.del=o.s.split('\n');d.add=o.r.split('\n');
if(o.s&&t.includes(o.s)){P.files[o.f]=t.replace(o.s,()=>o.r);d.ok=true;continue}
const g=findLoose(t,o.s);if(g){const a=t.split('\n');a.splice(g[0],g[1]-g[0],...o.r.split('\n'));P.files[o.f]=a.join('\n');d.ok=true;continue}
if(!t.trim()&&!o.s.trim()){P.files[o.f]=o.r;d.ok=true;continue}
d.why='ما لقيت المكان'}return det}

stop(){clearInterval(tm)}};return api}
