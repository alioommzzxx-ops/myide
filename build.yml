name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          sudo apt-get update
          sudo apt-get install -y imagemagick
          if [ -f icon.png ]; then
            for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
              IFS=: read n s f <<< "$d"
              r=android/app/src/main/res/mipmap-$n
              convert icon.png -resize ${s}x${s} $r/ic_launcher.png
              cp $r/ic_launcher.png $r/ic_launcher_round.png
              g=$((f*66/100))
              convert icon.png -resize ${g}x${g} -background none -gravity center -extent ${f}x${f} $r/ic_launcher_foreground.png
            done
          fi
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1 android/app/build/outputs/apk/debug/app-debug.apk --title APK --notes built
